<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据监控与展示系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .card {
            box-shadow: 0 2px 4px rgba(0,0,0,.05);
            border: none;
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #e3e6f0;
            font-weight: 600;
        }
        .table th {
            background-color: #f8f9fa;
            border-top: none;
            font-weight: 600;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        .currency {
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        .refresh-btn {
            transition: transform 0.3s ease;
        }
        .refresh-btn:active {
            transform: rotate(180deg);
        }
        .last-update {
            font-size: 0.875rem;
            color: #6c757d;
        }
        .data-section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-chart-line text-primary me-2"></i>
                <strong>数据监控与展示系统</strong>
            </a>
            <div class="d-flex align-items-center">
                <span class="me-3 last-update" id="lastUpdate">最后更新: --</span>
                <button class="btn btn-outline-primary btn-sm refresh-btn" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
                <span class="badge bg-success ms-2 status-badge" id="statusBadge">
                    <i class="fas fa-circle me-1"></i> 连接正常
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- 汇总卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted">总订单数</h5>
                        <h2 class="text-primary" id="totalOrders">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted">总客户数</h5>
                        <h2 class="text-success" id="totalCustomers">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted">总金额(CNY)</h5>
                        <h2 class="text-warning" id="totalAmount">¥0.00</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted">数据状态</h5>
                        <h2 class="text-info" id="dataStatus">就绪</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- 订单数据表格 -->
        <div class="data-section">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>
                        <i class="fas fa-shopping-cart me-2"></i>
                        合并订单数据
                    </span>
                    <small class="text-muted" id="ordersCount">0 条记录</small>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="ordersTable">
                            <thead>
                                <tr>
                                    <th>订单ID</th>
                                    <th>客户ID</th>
                                    <th>客户姓名</th>
                                    <th>金额</th>
                                    <th>货币</th>
                                    <th>金额(CNY)</th>
                                    <th>区域</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody">
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 汇总数据表格 -->
        <div class="data-section">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>
                        <i class="fas fa-chart-bar me-2"></i>
                        按区域统计平均金额
                    </span>
                    <small class="text-muted" id="summaryCount">0 个区域</small>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="summaryTable">
                            <thead>
                                <tr>
                                    <th>区域</th>
                                    <th>平均金额(CNY)</th>
                                    <th>订单数量</th>
                                </tr>
                            </thead>
                            <tbody id="summaryTableBody">
                                <!-- 数据将通过JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载指示器 -->
    <div class="modal fade" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2 mb-0">正在加载数据...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let lastCheckTime = 0;
        let autoRefreshInterval;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            startAutoRefresh();
        });

        // 加载数据函数
        async function loadData() {
            showLoading(true);
            
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                if (response.ok) {
                    updateUI(data);
                    updateStatus('success', '数据加载成功');
                } else {
                    throw new Error('数据加载失败');
                }
            } catch (error) {
                console.error('加载数据时出错:', error);
                updateStatus('error', '数据加载失败');
            } finally {
                showLoading(false);
            }
        }

        // 更新UI界面
        function updateUI(data) {
            // 更新最后更新时间
            document.getElementById('lastUpdate').textContent = 
                `最后更新: ${data.timestamp}`;
            
            // 更新数据状态
            document.getElementById('dataStatus').textContent = 
                data.database_exists ? '就绪' : '数据库未找到';
            
            // 更新订单表格
            updateOrdersTable(data.orders);
            
            // 更新汇总表格
            updateSummaryTable(data.summary);
            
            // 更新统计卡片
            updateStats(data.orders, data.summary);
            
            // 保存最后检查时间
            lastCheckTime = data.last_modified;
        }

        // 更新订单表格
        function updateOrdersTable(orders) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';
            
            orders.forEach(order => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${order.order_id}</strong></td>
                    <td>${order.customer_id}</td>
                    <td>${order.customer_name}</td>
                    <td>${order.amount}</td>
                    <td><span class="badge bg-secondary">${order.currency}</span></td>
                    <td class="currency text-success">¥${order.amount_cny.toLocaleString()}</td>
                    <td><span class="badge bg-info">${order.region}</span></td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('ordersCount').textContent = `${orders.length} 条记录`;
        }

        // 更新汇总表格
        function updateSummaryTable(summary) {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            
            summary.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.region}</strong></td>
                    <td class="currency text-primary">¥${item.avg_amount_cny.toLocaleString()}</td>
                    <td><span class="badge bg-primary">${item.order_count}</span></td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('summaryCount').textContent = `${summary.length} 个区域`;
        }

        // 更新统计信息
        function updateStats(orders, summary) {
            // 总订单数
            document.getElementById('totalOrders').textContent = orders.length;
            
            // 总客户数（去重）
            const uniqueCustomers = [...new Set(orders.map(order => order.customer_id))];
            document.getElementById('totalCustomers').textContent = uniqueCustomers.length;
            
            // 总金额
            const totalAmount = orders.reduce((sum, order) => sum + order.amount_cny, 0);
            document.getElementById('totalAmount').textContent = 
                `¥${totalAmount.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        }

        // 显示/隐藏加载指示器
        function showLoading(show) {
            const modal = new bootstrap.Modal(document.getElementById('loadingModal'));
            if (show) {
                modal.show();
            } else {
                modal.hide();
            }
        }

        // 更新状态指示器
        function updateStatus(type, message) {
            const badge = document.getElementById('statusBadge');
            const icon = badge.querySelector('i');
            
            badge.className = 'badge status-badge ms-2';
            
            switch (type) {
                case 'success':
                    badge.classList.add('bg-success');
                    icon.className = 'fas fa-circle me-1';
                    badge.textContent = '✓ ' + message;
                    break;
                case 'error':
                    badge.classList.add('bg-danger');
                    icon.className = 'fas fa-exclamation-circle me-1';
                    badge.textContent = '✗ ' + message;
                    break;
                case 'loading':
                    badge.classList.add('bg-warning');
                    icon.className = 'fas fa-sync-alt me-1 fa-spin';
                    badge.textContent = '↻ ' + message;
                    break;
            }
        }

        // 开始自动刷新
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/check_update');
                    const data = await response.json();
                    
                    if (data.has_changed && data.last_modified > lastCheckTime) {
                        console.log('检测到数据变化，重新加载数据...');
                        loadData();
                    }
                } catch (error) {
                    console.error('检查更新时出错:', error);
                }
            }, 5000); // 每5秒检查一次
        }

        // 停止自动刷新
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        }

        // 页面卸载时清理资源
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
</body>
</html>
