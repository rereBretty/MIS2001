name: Data Processing Pipeline

on:
  push:
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  process-data:
    name: Process and Update Database
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data processing script
      run: |
        python clean_and_merge.py

    - name: Upload database artifact
      uses: actions/upload-artifact@v4
      with:
        name: processed-database
        path: merged_data.db

    - name: Show completion message
      run: |
        echo "✅ Data processing completed successfully!"
        echo "📊 Database file has been generated/updated"
        echo "📁 File: merged_data.db"
        echo "🔗 Artifact available for download in Actions tab"